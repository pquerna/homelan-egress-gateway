version: 1

tenancy:
  default_tenant: default
  tenants:
    - id: default

ca:
  cert_path: /opt/egress-gateway/crabtrap/certs/ca.crt
  key_path: /opt/egress-gateway/crabtrap/certs/ca.key

policy:
  default_verdict: DENY
  fallback_mode: DENY
  enforcement: enforce
  body_mode: full_buffer
  body_cap_bytes: 1048576

destinations:
  debian:
    - deb.debian.org
    - security.debian.org
  javascript:
    - registry.npmjs.org
  python:
    - pypi.org
    - files.pythonhosted.org
  github:
    - github.com
    - api.github.com
    - "*.githubusercontent.com"
  openai:
    - api.openai.com
    - auth.openai.com
    - chatgpt.com
    - ab.chatgpt.com

listeners:
  - name: http-explicit
    bind: "192.168.32.100:8080"
    mode: explicit
    plane: http
    accept_absolute_form: true
    tls:
      mitm: mitm

entitlement:
  rules:
    - name: lan-restricted-containers
      min_attribution: packet_only
      posture: deny
      allow:
        - debian
        - javascript
        - python
        - github
        - openai

storage_sinks:
  - id: local-jsonl
    kind: disk
    path: /opt/egress-gateway/timebandit/log/audit.jsonl

detection:
  pipeline:
    - id: stage0
      kind: stage0-deterministic

admin:
  enabled: true
  socket_path: /run/timebandit/admin.sock
  http_addr: "127.0.0.1:9901"

deny_response:
  proxy_status_name: timebandit-egress
